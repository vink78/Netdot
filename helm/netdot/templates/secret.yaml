# Site.conf (the /usr/local/netdot/etc/Default.conf overlay) plus the
# database password the entrypoint and the application need. Held in a
# Secret: it carries the DB password.
#
# The base configuration (NETDOTNAME, LDAP, OAuth, ...) is rendered from
# values.yaml; the legacy DBA keys are mapped to the application account
# because the first-boot initializer runs as that account. Any other
# Default.conf variable can be added verbatim via `extraConfig`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netdot.fullname" . }}
  labels:
    {{- include "netdot.labels" . | nindent 4 }}
type: Opaque
stringData:
  Site.conf: |
    my $config = {
    DB_TYPE         => '{{ .Values.database.type }}',
    DB_HOST         => '{{ .Values.database.host }}',
    DB_PORT         => '{{ .Values.database.port }}',
    DB_DBA          => '{{ .Values.database.user }}',
    DB_DBA_PASSWORD => '{{ .Values.database.password }}',
    DB_DATABASE     => '{{ .Values.database.database }}',
    DB_NETDOT_USER  => '{{ .Values.database.user }}',
    DB_NETDOT_PASS  => '{{ .Values.database.password }}',
    NETDOTNAME      => '{{ .Values.netdotname }}',
    ADMINEMAIL      => '{{ .Values.adminEmail }}',
    NOCEMAIL        => '{{ .Values.nocEmail }}',
    DEFAULT_CONTACTLIST => '{{ .Values.defaultContactList }}',
    NetdotLDAPServer      => '{{ .Values.ldap.server }}',
    NetdotLDAPVersion     => {{ .Values.ldap.version }},
    NetdotLDAPUserDN      => '{{ .Values.ldap.userDN }}',
    NetdotLDAPSearchBase  => '{{ .Values.ldap.searchBase }}',
    NetdotLDAPRequireTLS  => {{ if .Values.ldap.requireTLS }}'yes'{{ else }}'no'{{ end }},
    NetdotLDAPFailToLocal => {{ if .Values.ldap.failToLocal }}'yes'{{ else }}'no'{{ end }},
    NetdotLDAPProxy       => {{ if .Values.ldap.proxy }}'yes'{{ else }}'no'{{ end }},
    NetdotLDAPTimeout     => {{ .Values.ldap.timeout }},
    NetdotOAuthEnabled   => {{ if .Values.oauth.enabled }}'yes'{{ else }}'no'{{ end }},
    NetdotOAuthLabel     => '{{ .Values.oauth.label }}',
    NetdotOAuthClientID  => '{{ .Values.oauth.clientId }}',
    NetdotOAuthSecret    => '{{ .Values.oauth.clientSecret }}',
    NetdotOAuthWellKnown => '{{ .Values.oauth.wellKnown }}',
    NetdotOAuthScope     => '{{ .Values.oauth.scope }}',
    NetdotOAuthUserClaim => '{{ .Values.oauth.userClaim }}',
    NetdotOAuthEmailToLDAP => {{ if .Values.oauth.emailToLDAP }}'yes'{{ else }}'no'{{ end }},
    {{- range $k, $v := .Values.extraConfig }}
    {{ $k }} => {{ $v }},
    {{- end }}
    }
  password: {{ .Values.database.password | quote }}
