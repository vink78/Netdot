  securitySchemes:
    session:
      description: Netdot session cookie (obtained via POST /login).
      in: cookie
      name: netdot_session
      type: apiKey
info:
  description: |-
    JSON API for Netdot (port of the legacy `/rest` interface).
    Every Netdot table is exposed as a resource:

      GET    /api/{table}            list all, or search (?column=value)
      GET    /api/{table}/{id}       single object (depth, linked_from options)
      GET    /api/{table}/meta_data  class metadata
      POST   /api/{table}            create (body: field values, FK fields as id)
      POST   /api/{table}/{id}       update
      DELETE /api/{table}/{id}       delete

    List responses are paginated (Netbox-style): {count, next, previous, results}.
    Use ?limit=N (default 50, max 1000) and ?offset=N; follow "next"/"previous".

    Foreign keys: on write pass the target id (integer); on read the field is a
    nested reference object: {id, url} plus the target's label fields, e.g.
      "zone": {"id":2,"url":"/netdot/api/zone/2/","name":"example.com"}.
    The label fields are the columns that identify the object (e.g. "name" for a
    zone/device, "address" + "prefix" for an ipblock, "name" + "zone" for an rr).
    Every object also carries a "url" field (e.g. /netdot/api/<table>/<id>/).
    Use ?depth=N to inline full referenced objects, ?linked_from=1 for back-references.

    Authentication: the Netdot web session (log in at /login). Unauthenticated
    requests get 401.
  title: Netdot API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/accessright:
    get:
      operationId: list_accessright
      parameters:
      - description: Filter by access.
        in: query
        name: access
        required: 0
        schema:
          type: string
      - description: Filter by object_class.
        in: query
        name: object_class
        required: 0
        schema:
          type: string
      - description: Filter by object_id.
        in: query
        name: object_id
        required: 0
        schema:
          type: string
      - description: Any non-FK column can also be used as a ?column=value filter
          (e.g. ?name=foo&site=2).
        in: query
        name: column
        required: 0
        schema:
          type: string
      - description: Maximum results per page (default 50, max 1000).
        in: query
        name: limit
        required: 0
        schema:
          default: 50
          maximum: 1000
          minimum: 1
          type: integer
      - description: Number of results to skip (use the "next" pointer to page forward).
        in: query
        name: offset
        required: 0
        schema:
          default: 0
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  count:
                    description: Total number of matching objects (before paging).
                    type: integer
                  next:
                    description: URL of the next page, or null.
                    nullable: 1
                    type: string
                  previous:
                    description: URL of the previous page, or null.
                    nullable: 1
                    type: string
                  results:
                    description: Objects on this page (up to "limit").
                    items:
                      $ref: '#/components/schemas/AccessRight'
                    type: array
                type: object
          description: Paginated list of AccessRight objects (count / next / previous
            / results).
        '401':
          '401':
            content:
              application/json:
                schema:
                  type: object
            description: Authentication required
      summary: List accessright objects (all, or filtered with ?column=value)
    post:
      operationId: create_accessright
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRight'
        required: 1
      responses:
        '200':
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AccessRight'
            description: Created object.
        '400':
          '400':
            content:
              application/json:
                schema:
                  type: object
            description: Bad request
        '401':
          '401':
            content:
              application/json:
                schema:
                  type: object
            description: Authentication required
        '403':
          '403':
            content:
              application/json:
                schema:
                  type: object
            description: Not allowed
      summary: Create a AccessRight (body = field values; FK fields as their id)
  /api/accessright/meta_data:
    get:
      operationId: meta_accessright
      responses:
        '200':
          content:
            application/json:
