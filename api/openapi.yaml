          type: string
        vert_pre:
          description: 'Vertical Precision: The vertical precision of the data, in
            centimeters, expressed using the same representation as SIZE'
          type: string
      type: object
    RRMX:
      description: A mail exchanger record (MX record) is a type of resource record
        in the Domain Name System that specifies a mail server responsible for accepting
        email messages on behalf of a recipient's domain and a preference value used
        to prioritize mail delivery if multiple mail servers are available. The set
        of MX records of a domain name specifies how email should be routed with the
        Simple Mail Transfer Protocol.
      properties:
        exchange:
          description: 'Exchange: A domain-name which specifies a host willing to
            act as a mail exchange for the owner name. The host name must map directly
            to one or more address records (A, or AAAA) in the DNS, and must not point
            to any CNAME records.'
          type: string
        preference:
          description: 'Preference: A 16 bit integer which specifies the preference
            given to this RR among others at the same owner.  Lower values are preferred.'
          type: integer
        rr:
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/FkReference_RR'
          description: Resource Record Foreign key to RR (pass the id on write; on
            read a nested {id, url, ...label fields} reference).
          type: ~
        ttl:
          description: 'TTL: Record TTL'
          type: string
        url:
          description: URL of this resource, e.g. /netdot/api/<table>/<id>/.
          type: string
      type: object
    RRNAPTR:
      description: Naming Authority Pointer (NAPTR) Resource Record (RFC3403)
      properties:
        flags:
          description: 'Flags: A <character-string> containing flags to control aspects
            of the rewriting and interpretation of the fields in the record.  Flags
            are single characters from the set A-Z and 0-9.  The case of the alphabetic
            characters is not significant.  The field can be empty.'
          type: string
        order_field:
          description: 'Order: A 16-bit unsigned integer specifying the order in which
            the NAPTR records MUST be processed in order to accurately represent the
            ordered list of Rules.  The ordering is from lowest to highest.'
          type: integer
        preference:
          description: 'Preference: A 16-bit unsigned integer that specifies the order
            in which NAPTR records with equal Order values SHOULD be processed, low
            numbers being processed before high numbers'
          type: integer
        regexpr:
          description: 'Regexp: A <character-string> containing a substitution expression
            that is applied to the original string held by the client in order to
            construct the next domain name to lookup.  See the DDDS Algorithm specification
            for the syntax of this field'
          type: string
        replacement:
          description: 'Replacement: A <domain-name> which is the next domain-name
            to query for depending on the potential values found in the flags field.  This
            field is used when the regular expression is a simple replacement operation.  Any
            value in this field MUST be a fully qualified domain-name'
          type: string
        rr:
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/FkReference_RR'
          description: Resource Record Foreign key to RR (pass the id on write; on
            read a nested {id, url, ...label fields} reference).
          type: ~
        services:
          description: 'Services: A <character-string> that specifies the Service
            Parameters applicable to this this delegation path.  It is up to the Application
