---
components:
  schemas:
    ASN:
      description: Autonomous System Number
      properties:
        description:
          description: 'Description: A short description of this ASN'
          type: string
        info:
          description: 'Comments: Comments'
          type: string
        number:
          description: 'Number: Autonomous System (AS) Number'
          type: integer
        rir:
          description: 'RIR: Regional Internet Registry from which ASN was obtained
            (AFRINIC, APNIC, ARIN, LACNIC, RIPE)'
          type: string
      type: object
    AccessRight:
      description: Acess rights for Netdot authorization.  Rights are tied to individual
        users (Person objects) or groups (Contact List objects)
      properties:
        access:
          description: 'Access: Type of access granted for the given object or class
            (view|edit|delete)'
          type: string
        object_class:
          description: 'Object Class: The class of object for which access is granted'
          type: string
        object_id:
          description: 'Object ID: Object ID for which access right applies'
          type: integer
      type: object
    ArpCache:
      description: Device ARP Cache
      properties:
        device:
          anyOf:
          - type: integer
          - type: string
          description: 'Device: Device where this Arp Cache was found Foreign key
            to Device (pass the id on write; label on read, depth 0; sibling "device_xlink"
            = "device/{id}").'
          type: ~
        tstamp:
          description: 'Timestamp: When this Cache was collected'
          format: date-time
          type: string
      type: object
    ArpCacheEntry:
      description: ARP Cache Entry
      properties:
        arpcache:
          anyOf:
          - type: integer
          - type: string
          description: 'ARP Cache: ARP Cache where this entry belongs Foreign key
            to ArpCache (pass the id on write; label on read, depth 0; sibling "arpcache_xlink"
            = "arpcache/{id}").'
          type: ~
        interface:
          anyOf:
          - type: integer
          - type: string
          description: 'Interface: Interface Foreign key to Interface (pass the id
            on write; label on read, depth 0; sibling "interface_xlink" = "interface/{id}").'
          type: ~
        ipaddr:
          anyOf:
          - type: integer
          - type: string
          description: 'IP: IP address Foreign key to Ipblock (pass the id on write;
            label on read, depth 0; sibling "ipaddr_xlink" = "ipblock/{id}").'
          type: ~
        physaddr:
          anyOf:
          - type: integer
          - type: string
          description: 'Physical Address: Physical Address (MAC) Foreign key to PhysAddr
            (pass the id on write; label on read, depth 0; sibling "physaddr_xlink"
            = "physaddr/{id}").'
          type: ~
      type: object
    Asset:
      description: Assets represent network hardware (devices or modules). If an asset
        is installed, it will be associated with a device or devicemodule object.
      properties:
        custom_serial:
          description: 'Custom S/N: Custom (human-set) serial number of this asset'
          type: string
        date_purchased:
          description: 'Date Purchased: The date the asset was purchased'
          format: date
          type: string
        description:
          description: 'Description: A short description for this Asset'
          type: string
        info:
          description: 'Comments: Comments'
          type: string
        inventory_number:
          description: 'Inventory: Asset inventory number'
          type: string
        maint_contract:
          anyOf:
          - type: integer
          - type: string
          description: 'Maint Contract: Reference to a maintenance or support contract
            with hardware vendor or third party. Foreign key to MaintContract (pass
            the id on write; label on read, depth 0; sibling "maint_contract_xlink"
            = "maintcontract/{id}").'
          type: ~
        maint_from:
          description: 'Maint Start: Device covered in maintenance from this date
            (YYYY-MM-DD)'
          format: date
          type: string
        maint_until:
          description: 'Maint End: Device covered in maintenance until this date (YYYY-MM-DD)'
          format: date
          type: string
        physaddr:
          anyOf:
          - type: integer
          - type: string
          description: 'Base MAC: The base MAC address of this Asset. Foreign key
            to PhysAddr (pass the id on write; label on read, depth 0; sibling "physaddr_xlink"
            = "physaddr/{id}").'
          type: ~
        po_number:
          description: 'PO Number: Purchase order number'
          type: string
        product_id:
          anyOf:
          - type: integer
          - type: string
          description: 'Product: product key Foreign key to Product (pass the id on
            write; label on read, depth 0; sibling "product_id_xlink" = "product/{id}").'
          type: ~
        reserved_for:
          description: 'Reserved For: For hardware that is not installed, specify
            if it is reserved and what for'
          type: string
        serial_number:
          description: 'S/N: Asset serial number'
          type: string
      type: object
    Audit:
      description: Audit Table to record database operations made by users
      properties:
        fields:
          description: 'Fields: Fields changed'
          type: string
        label:
          description: 'Label: Object Label'
          type: string
        object_id:
          description: 'Object ID: Object id'
          type: integer
        operation:
          description: 'Operation: DB Operation (insert, update, delete)'
          type: string
        tablename:
          description: 'Table: Table affected'
          type: string
        tstamp:
          description: 'Timestamp: When this change happened'
          format: date-time
          type: string
        username:
          description: 'Username: User that made the change'
          type: string
        vals:
          description: 'Values: Values that changed'
          type: string
      type: object
    Availability:
      description: A Time Period
      properties:
        info:
          description: 'Comments: Comments'
          type: string
        name:
          description: 'Time Period: Time period brief description. e.g. "24x7"'
          type: string
      type: object
    BGPPeering:
      description: A BGP Peering
      properties:
        authkey:
          description: 'Auth key: The authentication key for this BGP session'
          type: string
        bgppeeraddr:
          description: 'Peer Adress: BGP Peer Address'
          type: string
        bgppeerid:
          description: 'Peer ID: BGP Peer ID'
          type: string
        contactlist:
          anyOf:
          - type: integer
          - type: string
          description: 'Contact List: Who to contact about this peering session. Also
            used for Nagios alarms. Foreign key to ContactList (pass the id on write;
            label on read, depth 0; sibling "contactlist_xlink" = "contactlist/{id}").'
          type: ~
        device:
          anyOf:
          - type: integer
          - type: string
          description: 'Device: Device where BGP peering exists (the local device,
            that is) Foreign key to Device (pass the id on write; label on read, depth
            0; sibling "device_xlink" = "device/{id}").'
          type: ~
        entity:
          anyOf:
          - type: integer
          - type: string
          description: 'Entity: Entity with which Peering Exists Foreign key to Entity
            (pass the id on write; label on read, depth 0; sibling "entity_xlink"
            = "entity/{id}").'
          type: ~
        info:
          description: 'Comments: Comments'
          type: string
        last_changed:
          description: 'Last Changed: Time when the state last changed'
          format: date-time
          type: string
        max_v4_prefixes:
          description: 'Max IPv4 Prefixes: Maximum number of IPv4 prefixes we will
            permit from this peer'
          type: integer
        max_v6_prefixes:
          description: 'Max IPv6 Prefixes: Maximum number of IPv6 prefixes we will
            permit from this peer'
          type: integer
        monitored:
          description: 'Monitored?: Flag that specifies if this peering should be
            monitored'
          type: boolean
        peer_group:
          description: 'Peer Group: Name of the peer group'
          type: string
        state:
          description: 'State: Peering state'
          type: string
      type: object
    BackboneCable:
      description: A Backbone cable that interconnects two sites.  Backbone cables
        can have multiple strands.
      properties:
        end_closet:
          anyOf:
          - type: integer
          - type: string
          description: 'Destination Closet: Closet where this cable terminates Foreign
            key to Closet (pass the id on write; label on read, depth 0; sibling "end_closet_xlink"
            = "closet/{id}").'
          type: ~
        info:
          description: 'Comments: Comments'
          type: string
        installdate:
          description: 'Installed on: Date when this Cable was first installed (YYYY-MM-DD)'
          format: date
          type: string
        length:
          description: 'Length: The physical length of this cable'
          type: string
        name:
          description: 'Cable ID: A name given to this cable.'
          type: string
        owner:
          anyOf:
          - type: integer
          - type: string
          description: 'Owned by: Entity that owns this cable Foreign key to Entity
            (pass the id on write; label on read, depth 0; sibling "owner_xlink" =
            "entity/{id}").'
          type: ~
        start_closet:
          anyOf:
          - type: integer
          - type: string
          description: 'Origin Closet: Closet where this cable originates Foreign
            key to Closet (pass the id on write; label on read, depth 0; sibling "start_closet_xlink"
            = "closet/{id}").'
          type: ~
        type:
          anyOf:
          - type: integer
          - type: string
          description: 'Cable Type: The type of cable Foreign key to CableType (pass
            the id on write; label on read, depth 0; sibling "type_xlink" = "cabletype/{id}").'
          type: ~
      type: object
    CableStrand:
      description: A single cable strand/pair
      properties:
        cable:
          anyOf:
          - type: integer
          - type: string
          description: 'Cable ID: Cable to which this strand belongs Foreign key to
            BackboneCable (pass the id on write; label on read, depth 0; sibling "cable_xlink"
            = "backbonecable/{id}").'
          type: ~
        circuit_id:
          anyOf:
          - type: integer
          - type: string
          description: 'Circuit: ID of the circuit which this strand is a part of
            Foreign key to Circuit (pass the id on write; label on read, depth 0;
            sibling "circuit_id_xlink" = "circuit/{id}").'
          type: ~
        description:
          description: 'Description: A text description of this strand'
          type: string
        fiber_type:
          anyOf:
          - type: integer
          - type: string
          description: The type of fiber that this strand is made of Foreign key to
            FiberType (pass the id on write; label on read, depth 0; sibling "fiber_type_xlink"
            = "fibertype/{id}").
          type: ~
        info:
          description: 'Comments: Comments'
          type: string
        name:
          description: 'Strand ID: A name for this strand'
          type: string
        number:
          description: 'Number: The numeric order of this strand'
          type: integer
        status:
          anyOf:
          - type: integer
          - type: string
          description: 'Status: Status of this strand Foreign key to StrandStatus
            (pass the id on write; label on read, depth 0; sibling "status_xlink"
            = "strandstatus/{id}").'
          type: ~
      type: object
    CableType:
      description: Types of Cables
      properties:
        info:
          description: 'Comments: Comments'
          type: string
        name:
          description: 'Name: The name of this cable type'
          type: string
      type: object
    Circuit:
      description: A circuit can either be a WAN link provided by an external entity,
        or a set of [spliced] backbone cable strands terminated into two device interfaces
      properties:
        cid:
          description: 'Circuit ID: ID of this circuit.'
          type: string
        datetested:
          description: 'Date Tested: Date that this circuit was last tested (YYYY-MM-DD)'
          format: date
          type: string
        info:
          description: 'Comments: Comments'
          type: string
        installdate:
          description: 'Installed on: Date when this circuit was installed (YYYY-MM-DD)'
          format: date
          type: string
        linkid:
          anyOf:
          - type: integer
          - type: string
          description: 'Site Link: Site Link to which this circuit belongs Foreign
            key to SiteLink (pass the id on write; label on read, depth 0; sibling
            "linkid_xlink" = "sitelink/{id}").'
          type: ~
        loss:
          description: 'Loss: Tested loss (dbm)'
          type: string
        speed:
          description: 'Speed: The speed of this circuit (Mbps)'
          type: string
        status:
          anyOf:
          - type: integer
          - type: string
          description: 'Status: Status of this circuit Foreign key to CircuitStatus
            (pass the id on write; label on read, depth 0; sibling "status_xlink"
            = "circuitstatus/{id}").'
          type: ~
        type:
          anyOf:
          - type: integer
          - type: string
          description: 'Type: The type of this circuit Foreign key to CircuitType
            (pass the id on write; label on read, depth 0; sibling "type_xlink" =
            "circuittype/{id}").'
          type: ~
        vendor:
          anyOf:
          - type: integer
          - type: string
          description: 'Provider: Who provides this circuit, if it is not internal
            Foreign key to Entity (pass the id on write; label on read, depth 0; sibling
            "vendor_xlink" = "entity/{id}").'
          type: ~
      type: object
    CircuitStatus:
      description: Circuit status
      properties:
        info:
          description: 'Comments: Comments'
          type: string
        name:
          description: 'Status: Circuit Status'
          type: string
      type: object
    CircuitType:
      description: Circuit Type
      properties:
        info:
          description: 'Comments: Comments'
          type: string
        name:
          description: 'Type: Circuit Type'
          type: string
      type: object
    Closet:
      description: 'A Communications Closet.  A Closet is different from a normal
        Room in two ways: a) Backbone Cables (inter and intra building) terminate
        in Closets.  b) Horizontal Cables _start_ in Closets and _end_ in Rooms'
      properties:
        access_key_type:
          description: Access Key Type
          type: string
        asbestos_tiles:
          description: Asbestos Tiles
          type: boolean
        catv_taps:
          description: CableTV Taps
          type: string
        converted_patch_panels:
          description: Converted Patch Panels
          type: boolean
        dimensions:
          description: Dimensions
          type: string
        ground_buss:
          description: Ground Buss
          type: boolean
        hvac_type:
          description: HVAC Type
          type: string
        info:
          description: Comments
          type: string
        name:
          description: 'Name: An identifier for this Closet within a Site'
          type: string
        ot_blocks:
          description: 110 Blocks
          type: string
        outlets:
          description: Outlets
          type: string
        pair_count:
          description: Pair Count
          type: string
        patch_panels:
          description: Patch Panels
          type: string
        rack_type:
          description: Rack Type
          type: string
        racks:
          description: Racks
          type: string
        room:
          anyOf:
          - type: integer
          - type: string
          description: 'Room: The Room number where the closet is located Foreign
            key to Room (pass the id on write; label on read, depth 0; sibling "room_xlink"
            = "room/{id}").'
          type: ~
        ru_avail:
          description: Rack Units Available
          type: string
        shared_with:
          description: Shared With
          type: string
        ss_blocks:
          description: 66 Blocks
          type: string
        work_needed:
          description: Work Needed
          type: string
      type: object
    ClosetPicture:
      description: A Closet Picture.  Pictures are stored in the database in binary
        format.
      properties:
        bindata:
          description: Picture
          type: string
        closet:
          anyOf:
          - type: integer
          - type: string
          description: Closet Foreign key to Closet (pass the id on write; label on
            read, depth 0; sibling "closet_xlink" = "closet/{id}").
          type: ~
        filename:
          description: File Name
          type: string
        filesize:
          description: File Size
          type: string
        filetype:
          description: File Type
          type: string
        info:
          description: 'Comments: Comments'
          type: string
      type: object
    Contact:
      description: A Contact object is basically a Role of a certain Person.  People
        can be associated with one or more resources (devices, services, etc) for
        which they could be contacted.  Each Contact object represents one of these
        roles.
      properties:
        contactlist:
          anyOf:
          - type: integer
          - type: string
          description: 'Contact List: The list or group of Contacts to which this
            Contact belongs Foreign key to ContactList (pass the id on write; label
            on read, depth 0; sibling "contactlist_xlink" = "contactlist/{id}").'
          type: ~
        contacttype:
          anyOf:
          - type: integer
          - type: string
          description: 'Type of Contact: The type of this Contact Foreign key to ContactType
            (pass the id on write; label on read, depth 0; sibling "contacttype_xlink"
            = "contacttype/{id}").'
          type: ~
        escalation_level:
          description: 'Escalation Level: This level defines when this contact will
            be notified when monitoring devices or services.  Notifications usually
            escalate to a different set of contacts when the problem is not resolved
            in a certain amount of time.  This logic is implemented by the chosen
            external monitoring tool, not Netdot.'
          type: integer
        info:
          description: 'Comments: Comments'
          type: string
        notify_email:
          anyOf:
          - type: integer
          - type: string
          description: 'Email Notifications: Set this field to the desired Time Period
            to receive e-mail notifications when monitoring devices or services Foreign
            key to Availability (pass the id on write; label on read, depth 0; sibling
            "notify_email_xlink" = "availability/{id}").'
          type: ~
        notify_pager:
          anyOf:
          - type: integer
          - type: string
          description: 'Pager Notifications: Set this field to the desired Time Period
            to receive pager notifications when monitoring devices or services Foreign
            key to Availability (pass the id on write; label on read, depth 0; sibling
            "notify_pager_xlink" = "availability/{id}").'
          type: ~
        notify_voice:
          anyOf:
          - type: integer
          - type: string
          description: 'Voice Notifications: Set this field to the desired Time Period
            to receive voice notifications when monitoring devices or services Foreign
            key to Availability (pass the id on write; label on read, depth 0; sibling
            "notify_voice_xlink" = "availability/{id}").'
          type: ~
        person:
          anyOf:
          - type: integer
          - type: string
          description: 'Person: The actual Person that this contact refers to.  The
            Person table holds the actual contact information Foreign key to Person
            (pass the id on write; label on read, depth 0; sibling "person_xlink"
            = "person/{id}").'
          type: ~
      type: object
    ContactList:
      description: A list of contacts
      properties:
        info:
          description: 'Comments: Comments'
          type: string
        name:
          description: 'Name: Name for this group'
          type: string
      type: object
    ContactType:
      description: Type of contact
      properties:
        info:
          description: 'Comments: Comments'
          type: string
        name:
          description: 'Name: The name for this Contact Type'
          type: string
      type: object
    DataCache:
      description: Cached data
      properties:
        name:
          description: 'Name: Name of the data'
          type: string
      type: object
    Device:
      description: A network device.  Particularly, Devices in Netdot are network
        infrastructure devices that network administrators care about for inventory,
        monitoring and management purposes.  Not to be confused with end nodes
      properties:
        aliases:
          description: 'Aliases: Other names by which this Device is known'
          type: string
        asset_id:
          anyOf:
          - type: integer
          - type: string
          description: 'Asset: asset fk Foreign key to Asset (pass the id on write;
            label on read, depth 0; sibling "asset_id_xlink" = "asset/{id}").'
          type: ~
        auto_dns:
          description: 'Auto DNS?: Whether a DNS name should be auto generated for
            each IP address in this device'
          type: boolean
        bgpid:
          description: 'BGP ID: Border Gateway Protocol ID.  This usually has the
            form of an IP address'
          type: string
        bgplocalas:
          anyOf:
          - type: integer
          - type: string
          description: 'BGP Local AS: Border Gateway Protocol Local Autonomous System
            number Foreign key to ASN (pass the id on write; label on read, depth
            0; sibling "bgplocalas_xlink" = "asn/{id}").'
          type: ~
        canautoupdate:
          description: 'Auto Update?: If SNMP updates are automated, this value determines
            whether this Device should be included'
          type: boolean
        collect_arp:
          description: 'Collect ARP?: Whether Netdot should collect ARP cache data
            from this Device.  Notice that this is mostly intended for Routers, though
            not necessarily'
          type: boolean
        collect_fwt:
          description: 'Collect FWT?: Whether Netdot should collect bridge Forwarding
            Table (FWT) data from this Device'
          type: boolean
        collect_stp:
          description: 'Collect STP Info?: Enable or Disable querying device for Spanning
            Tree information'
          type: boolean
        community:
          description: 'SNMP Community: SNMP community'
          type: string
        customer_managed:
          description: 'Managed by Customer?: Does the operation of this Device fall
            into the responsibility of the customer (or "user" Entity)?'
          type: boolean
        date_installed:
          description: 'First Discovered: Date that this Device was installed, or
            first seen in the network'
          format: date-time
          type: string
        down_from:
          description: 'Down From: Device in down time from this date (YYYY-MM-DD)'
          format: date
          type: string
        down_until:
          description: 'Down Until: Device in down time until this date (YYYY-MM-DD)'
          format: date
          type: string
        extension:
          description: 'Extension: IP phone extension'
          type: integer
        host_device:
          anyOf:
          - type: integer
          - type: string
          description: 'Host Device: Another device which this one is part of, such
            as a virtual machine host. Host device will be used as parent device in
            monitoring exports. Foreign key to Device (pass the id on write; label
            on read, depth 0; sibling "host_device_xlink" = "device/{id}").'
          type: ~
        info:
          description: 'Comments: Comments'
          type: string
        ipforwarding:
          description: 'IP Forward?: Whether this device has IP forwarding enabled
            (IP-MIB::ipForwarding.0)'
          type: boolean
        last_arp:
          description: 'Last ARP: Last time ARP cache data was collected from this
            Device'
          format: date-time
          type: string
        last_fwt:
          description: 'Last FWT: Last time Forwarding Tables (FWT) were collected
            from this Device'
          format: date-time
          type: string
        last_updated:
          description: 'Last Updated: Date that this Device was last updated'
          format: date-time
          type: string
        layers:
          description: 'OSI Layers: Each digit represents a layer of the OSI model
            served by the device'
          type: string
        monitor_config:
          description: 'Monitor Config?: Indicates whether this Device should be included
            in configuration management tools (i.e. RANCID)'
          type: boolean
        monitor_config_group:
          description: 'Config Group: Configuration Management group (i.e. RANCID
            group)'
          type: string
        monitored:
          description: 'Monitored?: Determines if this Device should be included in
            the configurations for monitoring software'
          type: boolean
        monitoring_path_cost:
          description: 'Path Cost: Netdot uses a variant of the Dijkstra algorithm
            to determine monitoring dependencies. Results can be affected adversely,
            for instance, by passive devices with connections that are not actually
            passing traffic.  This value allows the administrator to set a higher
            cost for those devices, for the purpose of influencing the determination
            of monitoring paths.'
          type: integer
        monitoring_template:
          description: 'Monitoring Template: A template that defines common monitoring
            parameters for a group of devices. (E.g. a Nagios template to inherit
            from)'
          type: string
        monitorstatus:
          anyOf:
          - type: integer
          - type: string
          description: 'Monitored Status: The monitoring status of this Device.  This
            values is supposed to be fed back into Netdot by an external process Foreign
            key to MonitorStatus (pass the id on write; label on read, depth 0; sibling
            "monitorstatus_xlink" = "monitorstatus/{id}").'
          type: ~
        name:
          anyOf:
          - type: integer
          - type: string
          description: 'Name: The Device name is a reference to a DNS Resource Record
            (RR) Foreign key to RR (pass the id on write; label on read, depth 0;
            sibling "name_xlink" = "rr/{id}").'
          type: ~
        oobname:
          description: 'OOB Hostname #1: A name or command used to connect to this
            Device via an Out of Band connection, such as a Console Server'
          type: string
        oobname_2:
          description: 'OOB Hostname #2: A name or command used to connect to this
            Device via an Out of Band connection, such as a Console Server'
          type: string
        oobnumber:
          description: 'OOB Tel #1: A phone number used to connect to this Device
            via an Out of Band modem'
          type: string
        oobnumber_2:
          description: 'OOB Tel #2: A phone number used to connect to this Device
            via an Out of Band modem'
          type: string
        os:
          description: 'OS: Operating System name and version'
          type: string
        owner:
          anyOf:
          - type: integer
          - type: string
          description: 'Owner: Entity that owns this Device Foreign key to Entity
            (pass the id on write; label on read, depth 0; sibling "owner_xlink" =
            "entity/{id}").'
          type: ~
        power_outlet:
          description: 'Power #1: ID of the power outlet in a power distribution unit
            or similar'
          type: string
        power_outlet_2:
          description: 'Power #2: ID of the power outlet in a power distribution unit
            or similar'
          type: string
        rack:
          description: 'Rack: Rack ID where this Device is physically installed'
          type: string
        room:
          anyOf:
          - type: integer
          - type: string
          description: 'Room: Room where this Device is installed Foreign key to Room
            (pass the id on write; label on read, depth 0; sibling "room_xlink" =
            "room/{id}").'
