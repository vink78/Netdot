    RR:
      description: DNS Resource Record. Also known as the "owner", this object in
        Netdot groups all the records with the same name.
      properties:
        active:
          description: 'Active?: Should this record be included in the Zone files
            generated by Netdot?'
          type: boolean
        auto_update:
          description: 'Auto Update?: Determines whether this record can be updated
            by an automated process.  For example, if a Device Interface changes its
            name and the change is picked up by an SNMP update'
          type: boolean
        created:
          description: 'Created: Time when this resource record was created'
          format: date-time
          type: string
        expiration:
          description: 'Expiration Date: Expiration Date for this Record (YYYY-MM-DD)'
          format: date
          type: string
        info:
          description: 'Comments: Comments'
          type: string
        modified:
          description: 'Modified: Last time when this resource record was modified'
          format: date-time
          type: string
        name:
          description: 'Name: The identifier for this Record'
          type: string
        zone:
          anyOf:
          - type: integer
          - type: string
          description: 'Zone: Zone or Domain to which this record belongs Foreign
            key to Zone (pass the id on write; label on read, depth 0; sibling "zone_xlink"
            = "zone/{id}").'
          type: ~
      type: object
    RRADDR:
      description: A DNS "A" record makes a connection between a domain name and an
        IPv4 address.  A "AAAA" record does the same thing, but with IPv6 addresses.
        A "dual-stack" host can have both an A record and a AAAA record at the same
        time.
      properties:
        ipblock:
          anyOf:
          - type: integer
          - type: string
          description: Ipblock Foreign key to Ipblock (pass the id on write; label
            on read, depth 0; sibling "ipblock_xlink" = "ipblock/{id}").
          type: ~
        rr:
          anyOf:
          - type: integer
          - type: string
          description: Resource Record Foreign key to RR (pass the id on write; label
            on read, depth 0; sibling "rr_xlink" = "rr/{id}").
          type: ~
        ttl:
          description: 'TTL: Record TTL'
          type: string
      type: object
    RRCNAME:
      description: DNS CNAME records map an alias or nickname to the real or Canonical
        name which may lie outside the current zone. Canonical means expected or real
        name.
      properties:
        cname:
          description: 'CNAME: A domain-name which specifies the canonical or primary
            name for the owner.'
          type: string
        rr:
          anyOf:
          - type: integer
          - type: string
          description: 'Alias: Alias Name Foreign key to RR (pass the id on write;
            label on read, depth 0; sibling "rr_xlink" = "rr/{id}").'
          type: ~
        ttl:
          description: 'TTL: Record TTL'
          type: string
      type: object
    RRDS:
      description: The DS Resource Record refers to a DNSKEY RR and is used in the
        DNS DNSKEY authentication process.  A DS RR refers to a DNSKEY RR by storing
        the key tag, algorithm number, and a digest of the DNSKEY RR.
      properties:
        algorithm:
          description: 'Algorithm: The Algorithm field lists the algorithm number
            of the DNSKEY RR referred to by the DS record. The algorithm number used
            by the DS RR is identical to the algorithm number used by RRSIG and DNSKEY
            RRs.'
          type: integer
        digest:
          description: 'Digest: Digest'
          type: string
        digest_type:
          description: 'Digest Type: The DS RR refers to a DNSKEY RR by including
            a digest of that DNSKEY RR.  The Digest Type field identifies the algorithm
            used to construct the digest.'
          type: integer
        key_tag:
          description: 'Key Tag: The Key Tag field lists the key tag of the DNSKEY
            RR referred to by the DS record, in network byte order.'
          type: integer
        rr:
          anyOf:
          - type: integer
          - type: string
          description: Resource Record Foreign key to RR (pass the id on write; label
            on read, depth 0; sibling "rr_xlink" = "rr/{id}").
          type: ~
        ttl:
          description: 'TTL: Record TTL'
          type: string
      type: object
    RRHINFO:
      description: DNS HINFO records are used to acquire general information about
        a host.  The main use is for protocols such as FTP that can use special procedures
        when talking between machines or operating systems of the same type.  These
        may also be useful just for inventory purposes.  Publishing HINFO records
        may pose a security risk, thus Netdot administrators may choose not to include
        these records when exporting zone data
      properties:
        cpu:
          description: 'CPU: Central Processing Unit'
          type: string
        os:
          description: 'OS: Operating System'
          type: string
        rr:
          anyOf:
          - type: integer
          - type: string
          description: Resource Record Foreign key to RR (pass the id on write; label
            on read, depth 0; sibling "rr_xlink" = "rr/{id}").
          type: ~
        ttl:
          description: 'TTL: Record TTL'
          type: string
      type: object
    RRLOC:
      description: Location Information. See RFC1876
      properties:
        altitude:
          description: 'Altitude: The altitude of the center of the sphere described
            by SIZE, in centimeters, from a base of 100,000m below the WGS 84 reference
            spheroid used by GPS.'
          type: integer
        horiz_pre:
          description: 'Horizontal Precision: The horizontal precision of the data,
            in centimeters, expressed using the same representation as SIZE'
          type: string
        latitude:
          description: 'Latitude: The latitude of the center of the sphere described
            by SIZE, in thousandths of a second of arc. 2**31 represents the equator;
            numbers above that are north latitude.'
          type: integer
        longitude:
          description: 'Longitude: The longitude of the center of the sphere described
            by SIZE, in thousandths of a second of arc. 2**31 represents the prime
            meridian; numbers above that are east longitude.'
          type: integer
        rr:
          anyOf:
          - type: integer
          - type: string
          description: Resource Record Foreign key to RR (pass the id on write; label
            on read, depth 0; sibling "rr_xlink" = "rr/{id}").
          type: ~
        size:
          description: 'Size: The diameter of a sphere enclosing the described entity.'
          type: string
        vert_pre:
          description: 'Vertical Precision: The vertical precision of the data, in
            centimeters, expressed using the same representation as SIZE'
          type: string
      type: object
    RRMX:
      description: A mail exchanger record (MX record) is a type of resource record
        in the Domain Name System that specifies a mail server responsible for accepting
        email messages on behalf of a recipient's domain and a preference value used
        to prioritize mail delivery if multiple mail servers are available. The set
        of MX records of a domain name specifies how email should be routed with the
        Simple Mail Transfer Protocol.
      properties:
        exchange:
          description: 'Exchange: A domain-name which specifies a host willing to
            act as a mail exchange for the owner name. The host name must map directly
            to one or more address records (A, or AAAA) in the DNS, and must not point
            to any CNAME records.'
          type: string
        preference:
          description: 'Preference: A 16 bit integer which specifies the preference
            given to this RR among others at the same owner.  Lower values are preferred.'
          type: integer
        rr:
          anyOf:
          - type: integer
          - type: string
          description: Resource Record Foreign key to RR (pass the id on write; label
            on read, depth 0; sibling "rr_xlink" = "rr/{id}").
          type: ~
        ttl:
          description: 'TTL: Record TTL'
          type: string
      type: object
    RRNAPTR:
      description: Naming Authority Pointer (NAPTR) Resource Record (RFC3403)
      properties:
        flags:
          description: 'Flags: A <character-string> containing flags to control aspects
            of the rewriting and interpretation of the fields in the record.  Flags
            are single characters from the set A-Z and 0-9.  The case of the alphabetic
            characters is not significant.  The field can be empty.'
          type: string
        order_field:
          description: 'Order: A 16-bit unsigned integer specifying the order in which
            the NAPTR records MUST be processed in order to accurately represent the
            ordered list of Rules.  The ordering is from lowest to highest.'
          type: integer
        preference:
          description: 'Preference: A 16-bit unsigned integer that specifies the order
            in which NAPTR records with equal Order values SHOULD be processed, low
            numbers being processed before high numbers'
          type: integer
        regexpr:
          description: 'Regexp: A <character-string> containing a substitution expression
            that is applied to the original string held by the client in order to
            construct the next domain name to lookup.  See the DDDS Algorithm specification
            for the syntax of this field'
          type: string
        replacement:
          description: 'Replacement: A <domain-name> which is the next domain-name
            to query for depending on the potential values found in the flags field.  This
            field is used when the regular expression is a simple replacement operation.  Any
            value in this field MUST be a fully qualified domain-name'
          type: string
        rr:
          anyOf:
          - type: integer
          - type: string
          description: Resource Record Foreign key to RR (pass the id on write; label
            on read, depth 0; sibling "rr_xlink" = "rr/{id}").
          type: ~
        services:
          description: 'Services: A <character-string> that specifies the Service
            Parameters applicable to this this delegation path.  It is up to the Application
            Specification to specify the values found in this field.'
          type: string
        ttl:
          description: 'TTL: Record TTL'
          type: string
      type: object
    RRNS:
      description: DNS NS Record
      properties:
        nsdname:
          description: 'Name Server: A domain-name which specifies a host which should
            be authoritative for the specified class and domain.'
          type: string
        rr:
          anyOf:
          - type: integer
          - type: string
          description: Resource Record Foreign key to RR (pass the id on write; label
            on read, depth 0; sibling "rr_xlink" = "rr/{id}").
          type: ~
        ttl:
          description: 'TTL: Record TTL'
          type: string
      type: object
    RRPTR:
      description: A PTR record is the reverse of an A record. That is, it maps an
        IP address to a hostname, rather than vice versa.
      properties:
        ipblock:
          anyOf:
          - type: integer
          - type: string
          description: IP Foreign key to Ipblock (pass the id on write; label on read,
            depth 0; sibling "ipblock_xlink" = "ipblock/{id}").
          type: ~
        ptrdname:
          description: 'Domain Name: A domain-name which points to some location in
            the domain name space.'
          type: string
        rr:
          anyOf:
          - type: integer
          - type: string
          description: Resource Record Foreign key to RR (pass the id on write; label
            on read, depth 0; sibling "rr_xlink" = "rr/{id}").
          type: ~
        ttl:
          description: 'TTL: Record TTL'
          type: string
      type: object
    RRSRV:
      description: DNS SRV Record (RFC 2782)
      properties:
        port:
          description: 'Port: The port on this target host of this service.  The range
            is 0-65535'
          type: integer
        priority:
          description: 'Priority: The priority of this target host.  A client MUST
            attempt to contact the target host with the lowest-numbered priority it
            can reach; target hosts with the same priority SHOULD be tried in an order
            defined by the weight field.  The range is 0-65535'
          type: integer
        rr:
          anyOf:
          - type: integer
          - type: string
          description: 'Name: The domain this SRV record refers to. Foreign key to
            RR (pass the id on write; label on read, depth 0; sibling "rr_xlink" =
            "rr/{id}").'
          type: ~
        target:
          description: 'Target: The domain name of the target host.  There MUST be
            one or more address records for this name, the name MUST NOT be an alias
            (in the sense of RFC 1034 or RFC 2181)'
          type: string
        ttl:
          description: 'TTL: Record TTL'
          type: string
        weight:
          description: 'Weight: A server selection mechanism.  The weight field specifies
            a relative weight for entries with the same priority. Larger weights SHOULD
            be given a proportionately higher probability of being selected. The range
            of this number is 0-65535'
          type: integer
      type: object
    RRTXT:
      description: DNS TXT records are used to hold descriptive text.  The semantics
        of the text depends on the domain where it is found.
      properties:
        rr:
          anyOf:
          - type: integer
          - type: string
          description: Resource Record Foreign key to RR (pass the id on write; label
            on read, depth 0; sibling "rr_xlink" = "rr/{id}").
          type: ~
        ttl:
          description: 'TTL: Record TTL'
          type: string
        txtdata:
