# Netdot — Apache reverse proxy (mod_proxy)
#
# WORKS FOR APACHE 2.2 AND 2.4 (same mod_proxy syntax).
#
# Netdot is now a Mojolicious application. It runs as a standalone daemon on
# 127.0.0.1:3000, managed by the netdot.service systemd unit (see
# etc/netdot.service). Apache only reverse-proxies the /netdot path to it,
# preserving the /netdot prefix. Authentication and authorization are handled
# INSIDE the app, so a single proxy config serves every deployment (no more
# per-Apache-version or per-auth-method files).
#
# Enable the required modules first:
#     a2enmod proxy proxy_http
#
# Include this in a vhost (or httpd.conf); adjust the backend host:port if it
# differs from 127.0.0.1:3000.
# -----------------------------------------------------------------------------

# Pass the original Host header to the backend so absolute URLs are built
# correctly.
ProxyPreserveHost On

# Forward /netdot to the Mojolicious daemon, keeping the /netdot prefix:
#   /netdot/...  ->  http://127.0.0.1:3000/netdot/...
ProxyPass        /netdot http://127.0.0.1:3000/netdot
ProxyPassReverse /netdot http://127.0.0.1:3000/netdot
