# Build and publish the Netdot 2.0 application image.
#
# The Actions checkout is a clean tree, so each image is reproducible per
# commit. The netdisco-mibs ref is pinned in this workflow (the pinned
# release-tag checkout step) for the same reason.
#
# Images are published on pushes to master and on v* tags — merging dev
# into master is what publishes a new image (release control). A tag
# build publishes the tag name itself (e.g. ghcr.io/vink78/netdot:v2.0.0)
# and does not move latest.
name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The MIBs are vendored into the image from the build context (the
      # Dockerfile cannot git-clone on the GHCR-hosted runners); the ref is
      # pinned here for reproducible builds.
      - name: Check out netdisco-mibs (pinned release tag)
        uses: actions/checkout@v4
        with:
          repository: netdisco/netdisco-mibs
          ref: 4.065
          fetch-depth: 1
          path: netdisco-mibs

      - id: shortsha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          # A push to master publishes v2.0.0-dev-<shortsha>; a v* tag
          # publishes the tag name itself (releases are cut by tagging).
          IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.0-dev-{0}', steps.shortsha.outputs.sha) }}
        with:
          context: .
          push: true
          # No attestations: single-platform builds push one plain
          # manifest per tag (an index + attestation manifest would add
          # untagged versions to the GHCR versions page).
          provenance: false
          sbom: false
          tags: |
            ghcr.io/vink78/netdot:${{ env.IMAGE_TAG }}
            ${{ github.ref == 'refs/heads/master' && 'ghcr.io/vink78/netdot:latest' || '' }}
          build-args: |
            NETDOT_VERSION=${{ env.IMAGE_TAG }}
          # type=registry (rather than the newer type=ghcr) so the cache
          # also works with older BuildKit versions.
          cache-from: type=registry,ref=ghcr.io/vink78/netdot-buildx-cache:latest
          cache-to: type=registry,ref=ghcr.io/vink78/netdot-buildx-cache:latest,mode=max
